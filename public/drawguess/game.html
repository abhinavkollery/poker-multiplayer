<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw & Guess 🎨 | Party Games</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    :root {
      --accent: #f59e0b;
      --accent-rgb: 245, 158, 11;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .game-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 20px;
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .status-badge {
      font-size: 0.85rem;
      padding: 4px 10px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 999px;
      color: #f59e0b;
      font-weight: 600;
    }

    .word-banner {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .word-display {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #38bdf8;
      font-family: monospace;
    }

    .timer-pill {
      font-size: 1.3rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 240px 1fr 320px;
      gap: 16px;
      flex: 1;
      min-height: 580px;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .side-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .canvas-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #drawCanvas {
      background: #ffffff;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .toolbar {
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .color-palette {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .color-swatch.active {
      transform: scale(1.2);
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .tool-group {
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s;
    }

    .tool-btn.active, .tool-btn:hover {
      background: rgba(245, 158, 11, 0.3);
      border-color: #f59e0b;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .player-row.is-drawer {
      border: 1px solid #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .player-row.has-guessed {
      border: 1px solid #10b981;
      background: rgba(16, 185, 129, 0.1);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 480px;
      padding-right: 4px;
      margin-bottom: 12px;
    }

    .chat-bubble {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .chat-bubble.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-weight: 600;
    }

    .chat-bubble.system {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      font-style: italic;
    }

    .chat-bubble.close {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-weight: 600;
    }

    .chat-bubble.normal {
      background: rgba(255, 255, 255, 0.07);
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }

    .word-choice-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-size: 1.25rem;
      font-weight: 800;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      margin: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s;
    }

    .word-choice-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Top Navigation & Room Status -->
    <div class="top-bar">
      <div class="brand-section">
        <h1 class="brand-title">🎨 Draw & Guess</h1>
        <span class="status-badge" id="roundBadge">Round 1 / 3</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="tool-btn" onclick="window.openPartySwitchModal(socket, roomId, (currentGameState?.isHost || currentGameState?.players?.[0]?.id === myPlayerId))" style="color: #38bdf8; border-color: rgba(56, 189, 248, 0.4);" title="Switch Game with Party">🔄 Switch Game</button>
        <span style="font-weight: 700; color: #94a3b8;">ROOM:</span>
        <span id="roomCodeDisplay" style="font-size: 1.1rem; font-weight: 800; color: #38bdf8; letter-spacing: 2px;">------</span>
        <button class="tool-btn" onclick="copyInviteLink()">🔗 Invite</button>
        <button class="tool-btn" onclick="showQRCode()">📱 QR</button>
        <a href="/" class="tool-btn" style="text-decoration: none;">🏠 Hub</a>
      </div>
    </div>

    <!-- Word Banner & Timer -->
    <div class="word-banner">
      <div id="drawerIndicator" style="font-weight: 600; color: #94a3b8;">Waiting for game...</div>
      <div class="word-display" id="wordDisplay">_ _ _ _ _</div>
      <div class="timer-pill" id="timerDisplay">60s</div>
    </div>

    <!-- Main Game Grid -->
    <div class="main-grid">
      <!-- Players Scoreboard -->
      <div class="side-card">
        <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 1rem; color: #94a3b8; text-transform: uppercase;">Players</h3>
        <div id="playerList" style="flex: 1; overflow-y: auto;">
          <!-- Dynamically populated -->
        </div>
        <button id="startGameBtn" class="word-choice-btn" style="width: 100%; margin: 8px 0 0 0; display: none;" onclick="startGame()">Start Game</button>
      </div>

      <!-- Canvas Area -->
      <div class="canvas-card" id="canvasWrapper">
        <canvas id="drawCanvas" width="800" height="550"></canvas>

        <!-- Word Chooser Overlay -->
        <div id="wordChoiceOverlay" class="modal-overlay" style="display: none;">
          <h2 style="font-size: 1.8rem; margin-bottom: 8px;">It's your turn to draw! 🎨</h2>
          <p style="color: #94a3b8; margin-bottom: 20px;">Choose a word to start drawing:</p>
          <div id="wordChoicesContainer" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
        </div>

        <!-- Reveal Overlay -->
        <div id="revealOverlay" class="modal-overlay" style="display: none;">
          <h2 style="font-size: 2rem; color: #38bdf8;" id="revealWordTitle">The word was: APPLE</h2>
          <p id="revealScoresSummary" style="color: #cbd5e1; font-size: 1.1rem;"></p>
        </div>

        <!-- Drawing Toolbar -->
        <div class="toolbar" id="drawingToolbar" style="display: none;">
          <div class="color-palette" id="colorPalette"></div>
          <div class="tool-group">
            <button class="tool-btn size-btn" onclick="setBrushSize(3)">Thin</button>
            <button class="tool-btn size-btn active" onclick="setBrushSize(7)">Med</button>
            <button class="tool-btn size-btn" onclick="setBrushSize(16)">Thick</button>
            <button class="tool-btn size-btn" onclick="setBrushSize(32)">Giant</button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" id="eraserBtn" onclick="toggleEraser()">🧹 Eraser</button>
            <button class="tool-btn" onclick="undoStroke()">↩️ Undo</button>
            <button class="tool-btn" style="color: #f87171;" onclick="clearCanvas()">🗑️ Clear</button>
          </div>
        </div>
      </div>

      <!-- Guess Chat Stream -->
      <div class="side-card">
        <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 1rem; color: #94a3b8; text-transform: uppercase;">Live Guesses</h3>
        <div class="chat-messages" id="chatStream"></div>
        <form id="guessForm" onsubmit="submitGuess(event)" style="display: flex; gap: 8px;">
          <input type="text" id="guessInput" placeholder="Type your guess..." autocomplete="off" style="flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 0.95rem;">
          <button type="submit" class="tool-btn" style="background: var(--accent); color: #000; font-weight: 700;">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/socket-client.js"></script>
  <script src="/shared/sounds.js"></script>
  <script src="/shared/reactions.js"></script>
  <script src="/shared/qrcode.js"></script>
  <script>
    const socket = (typeof initPartySocket === 'function') ? initPartySocket() : io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('room') || urlParams.get('roomId') || '').toUpperCase();
    const playerName = (typeof window.resolvePlayerName === 'function')
      ? window.resolvePlayerName(false)
      : (urlParams.get('name') || sessionStorage.getItem('playerName') || 'Player').trim();
    sessionStorage.setItem('playerName', playerName);
    localStorage.setItem('party_player_name', playerName);
    localStorage.setItem('playerName', playerName);

    let myPlayerId = null;
    let isDrawer = false;
    let currentColor = '#000000';
    let brushSize = 7;
    let isEraser = false;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let lastStrokesRenderedCount = 0;
    let currentGameState = null;

    if (window.listenForPartyGameSwitch) {
      window.listenForPartyGameSwitch(socket, playerName);
    }

    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const COLORS = [
      '#000000', '#64748b', '#ffffff', '#ef4444', '#f97316', '#f59e0b',
      '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#78350f'
    ];

    // Build Palette
    const paletteContainer = document.getElementById('colorPalette');
    COLORS.forEach((col, idx) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (idx === 0 ? ' active' : '');
      swatch.style.backgroundColor = col;
      swatch.onclick = () => selectColor(col, swatch);
      paletteContainer.appendChild(swatch);
    });

    function selectColor(color, swatchEl) {
      currentColor = color;
      isEraser = false;
      document.getElementById('eraserBtn').classList.remove('active');
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      if (swatchEl) swatchEl.classList.add('active');
      sounds.play('click');
    }

    function setBrushSize(size) {
      brushSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      sounds.play('click');
    }

    function toggleEraser() {
      isEraser = !isEraser;
      document.getElementById('eraserBtn').classList.toggle('active', isEraser);
      sounds.play('click');
    }

    // Canvas coordinate scaling
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDraw(e) {
      if (!isDrawer) return;
      isDrawing = true;
      const pos = getCanvasPos(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    function draw(e) {
      if (!isDrawing || !isDrawer) return;
      e.preventDefault();
      const pos = getCanvasPos(e);

      const strokeData = {
        x0: Math.round(lastX),
        y0: Math.round(lastY),
        x1: Math.round(pos.x),
        y1: Math.round(pos.y),
        color: isEraser ? '#ffffff' : currentColor,
        size: isEraser ? brushSize * 2.5 : brushSize
      };

      renderStroke(strokeData);
      lastStrokesRenderedCount++;
      socket.emit('drawguess:stroke', strokeData);

      lastX = pos.x;
      lastY = pos.y;
    }

    function stopDraw() {
      isDrawing = false;
    }

    function renderStroke(s) {
      ctx.beginPath();
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.moveTo(s.x0, s.y0);
      ctx.lineTo(s.x1, s.y1);
      ctx.stroke();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDraw);

    function clearCanvas() {
      if (!isDrawer) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lastStrokesRenderedCount = 0;
      socket.emit('drawguess:clear');
      sounds.play('click');
    }

    function undoStroke() {
      if (!isDrawer) return;
      socket.emit('drawguess:undo');
      sounds.play('click');
    }

    // Connect & Join Room
    socket.on('connect', () => {
      myPlayerId = socket.id;
      if (roomId) {
        socket.emit('join-room', { roomId, name: playerName });
      }
    });

    socket.on('room-joined', (data) => {
      document.getElementById('roomCodeDisplay').textContent = data.roomId;
    });

    socket.on('drawguess:stroke', (strokeData) => {
      renderStroke(strokeData);
      lastStrokesRenderedCount++;
    });

    socket.on('drawguess:clear', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lastStrokesRenderedCount = 0;
    });

    socket.on('drawguess:undo', () => {
      if (currentGameState && currentGameState.strokes) {
        currentGameState.strokes.pop();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        lastStrokesRenderedCount = 0;
        currentGameState.strokes.forEach(s => renderStroke(s));
        lastStrokesRenderedCount = currentGameState.strokes.length;
      }
    });

    socket.on('game-state', (state) => {
      currentGameState = state;
      updateUI(state);
    });

    socket.on('chat-message', (data) => {
      appendChatMessage(data.name, data.message, 'normal');
    });

    socket.on('party:reaction', ({ emoji, senderName }) => {
      if (window.Reactions) window.Reactions.showParticle(emoji);
    });

    function updateUI(state) {
      if (!state) return;
      document.getElementById('roundBadge').textContent = `Round ${state.currentRound} / ${state.maxRounds}`;
      document.getElementById('timerDisplay').textContent = `${state.timeLeft}s`;

      const amHost = (state.isHost !== undefined) ? state.isHost : (state.players[0]?.id === myPlayerId || sessionStorage.getItem('isHost') === 'true');
      isDrawer = state.isDrawer;

      // Start button for host during waiting
      const startBtn = document.getElementById('startGameBtn');
      if (state.state === 'waiting' && amHost) {
        startBtn.style.display = 'block';
      } else {
        startBtn.style.display = 'none';
      }

      // Drawing toolbar toggle
      document.getElementById('drawingToolbar').style.display = (isDrawer && state.state === 'drawing') ? 'flex' : 'none';

      // Drawer indicator & Word display
      const drawerName = state.drawer ? state.drawer.name : 'Unknown';
      if (state.state === 'waiting') {
        document.getElementById('drawerIndicator').textContent = 'Waiting to start...';
        document.getElementById('wordDisplay').textContent = 'READY';
      } else if (state.isDrawer) {
        document.getElementById('drawerIndicator').textContent = '🎨 You are drawing!';
        document.getElementById('wordDisplay').textContent = state.word || 'Choose Word';
      } else {
        document.getElementById('drawerIndicator').textContent = `🎨 ${drawerName} is drawing!`;
        document.getElementById('wordDisplay').textContent = state.word;
      }

      // Word choice overlay for drawer
      const choiceOverlay = document.getElementById('wordChoiceOverlay');
      if (state.state === 'choosing' && isDrawer && state.wordChoices?.length) {
        choiceOverlay.style.display = 'flex';
        const container = document.getElementById('wordChoicesContainer');
        container.innerHTML = '';
        state.wordChoices.forEach(w => {
          const btn = document.createElement('button');
          btn.className = 'word-choice-btn';
          btn.textContent = w;
          btn.onclick = () => {
            socket.emit('player-action', { action: 'select-word', word: w });
            choiceOverlay.style.display = 'none';
            sounds.play('cardFlip');
          };
          container.appendChild(btn);
        });
      } else {
        choiceOverlay.style.display = 'none';
      }

      // Reveal overlay
      const revealOverlay = document.getElementById('revealOverlay');
      if (state.state === 'revealing') {
        revealOverlay.style.display = 'flex';
        document.getElementById('revealWordTitle').textContent = `The word was: ${state.word}`;
      } else {
        revealOverlay.style.display = 'none';
      }

      // Efficient stroke rendering: only repaint from scratch on turn/state reset
      const serverStrokes = Array.isArray(state.strokes) ? state.strokes : [];
      if (state.state === 'waiting' || state.state === 'choosing' || serverStrokes.length < lastStrokesRenderedCount) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        lastStrokesRenderedCount = 0;
        serverStrokes.forEach(s => renderStroke(s));
        lastStrokesRenderedCount = serverStrokes.length;
      } else if (serverStrokes.length > lastStrokesRenderedCount) {
        for (let i = lastStrokesRenderedCount; i < serverStrokes.length; i++) {
          renderStroke(serverStrokes[i]);
        }
        lastStrokesRenderedCount = serverStrokes.length;
      }

      // Render player list
      const pList = document.getElementById('playerList');
      pList.innerHTML = '';
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      sorted.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row' + (p.isDrawer ? ' is-drawer' : '') + (p.hasGuessed ? ' has-guessed' : '');
        row.innerHTML = `
          <div>
            <span style="color: #94a3b8; font-weight: 700; margin-right: 6px;">#${idx + 1}</span>
            <span style="font-weight: 600;">${p.name} ${p.isDrawer ? '✏️' : ''} ${p.hasGuessed ? '✅' : ''}</span>
          </div>
          <span style="font-weight: 800; color: #f59e0b;">${p.score} pts</span>
        `;
        pList.appendChild(row);
      });

      // Update guess chat input state
      const guessInput = document.getElementById('guessInput');
      if (isDrawer) {
        guessInput.disabled = true;
        guessInput.placeholder = "You are drawing! Keep it secret 🤫";
      } else if (state.hasGuessed) {
        guessInput.disabled = true;
        guessInput.placeholder = "You guessed it! Good job 🎉";
      } else {
        guessInput.disabled = false;
        guessInput.placeholder = "Type your guess...";
      }

      // Render chat log from server
      const chatStream = document.getElementById('chatStream');
      chatStream.innerHTML = '';
      if (Array.isArray(state.chatLog)) {
        state.chatLog.forEach(m => {
          appendChatMessage('', m.text, m.type);
        });
      }
    }

    function appendChatMessage(name, text, type) {
      const stream = document.getElementById('chatStream');
      const msg = document.createElement('div');
      msg.className = `chat-bubble ${type}`;
      msg.textContent = name ? `${name}: ${text}` : text;
      stream.appendChild(msg);
      stream.scrollTop = stream.scrollHeight;
    }

    function submitGuess(e) {
      e.preventDefault();
      const input = document.getElementById('guessInput');
      const val = input.value.trim();
      if (!val) return;
      socket.emit('drawguess:guess', { text: val });
      input.value = '';
    }

    function startGame() {
      socket.emit('start-game');
      sounds.play('click');
    }

    function copyInviteLink() {
      const link = window.getCleanInviteUrl ? window.getCleanInviteUrl(roomId, 'drawguess') : `${window.location.origin}/?join=${encodeURIComponent(roomId)}`;
      navigator.clipboard.writeText(link);
      sounds.play('success');
      alert(`Room invite link copied to clipboard:\n${link}`);
    }

    function showQRCode() {
      if (window.QRCodeModal) {
